[project]
name = "k8s-troubleshooter-agent"
version = "0.1.0"
description = "Kubernetes troubleshooting agent with rule-based diagnosis and LLM fallback"
requires-python = ">=3.11"
dependencies = [
    "kubernetes>=30.0.0",
    "openai>=1.30.0",
    "prompt-toolkit>=3.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
k8s-troubleshooter = "k8s_troubleshooter.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/k8s_troubleshooter"]
